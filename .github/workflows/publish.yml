name: Publish Minecraft Image to ECR

on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 731401215014.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mc-server
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull pinned image and retag for ECR
        run: |
          docker pull itzg/minecraft-server:java21
          docker tag itzg/minecraft-server:java21 ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Smoke test - verify server initializes
        run: |
          docker run -d \
            --name mc-test \
            -e EULA=TRUE \
            -e VERSION=1.21.1 \
            -e JAVA=21 \
            -e MEMORY=1G \
            itzg/minecraft-server:java21

          echo "Waiting for Minecraft to initialize..."
          for i in $(seq 1 12); do
            sleep 10
            echo "Check $i/12..."
            if docker logs mc-test 2>&1 | grep -q "Done"; then
              echo "Smoke test passed - server initialized successfully"
              docker stop mc-test
              exit 0
            fi
          done

          echo "Smoke test failed - server did not initialize in time"
          docker logs mc-test
          docker stop mc-test
          exit 1

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Summary
        run: |
          echo "Successfully published image:"
          echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
